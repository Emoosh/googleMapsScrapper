services:

  # ─── POSTGRES + POSTGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-neredenevar}
      POSTGRES_USER:     ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-neredenevar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── TOR PROXY ──────────────────────────────────────────────────────────────
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    environment:
      - PASSWORD=torpass
    healthcheck:
      test: ["CMD-SHELL", "curl -sx socks5h://localhost:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── SCRAPER ────────────────────────────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
      tor:
        condition: service_healthy
    environment:
      - SCRAPER_OUTPUT=/data/scraped_data.json
      - HEADLESS=true
      - REDIS_URL=redis://redis:6379
      - PROXY_URL=socks5://tor:9050
      - TOR_HOST=tor
      - TOR_PASSWORD=torpass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── SCRAPER WORKER ─────────────────────────────────────────────────────────
  # Paralel scraping için: docker compose up --scale scraper-worker=3
  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    command: uvicorn scraper_worker:app --host 0.0.0.0 --port 8085
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
      tor:
        condition: service_healthy
    environment:
      - HEADLESS=true
      - REDIS_URL=redis://redis:6379
      - PROXY_URL=socks5://tor:9050
      - SCRAPER_OUTPUT=/data/scraped_data.json
      - TOR_HOST=tor
      - TOR_PASSWORD=torpass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── ANALYZER ───────────────────────────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    command: uvicorn comment_analyzer:fa_app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    volumes:
      - data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - ANALYZER_INPUT=/data/scraped_data.json
      - ANALYZER_OUTPUT=/data/analyzed_data.json
      - REDIS_URL=redis://redis:6379
      - CUDA_VISIBLE_DEVICES=
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── INDEXER ────────────────────────────────────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    command: uvicorn indexer:fa_app --host 0.0.0.0 --port 8082
    ports:
      - "8082:8082"
    volumes:
      - data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      - INDEXER_INPUT=/data/scraped_data.json
      - CHROMA_PATH=/data/chroma_db
      - REDIS_URL=redis://redis:6379
      - CUDA_VISIBLE_DEVICES=

    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Q&A ────────────────────────────────────────────────────────────────────
  qa:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    command: uvicorn place_qa:app --host 0.0.0.0 --port 8083
    ports:
      - "8083:8083"
    volumes:
      - data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - CHROMA_PATH=/data/chroma_db
      - CUDA_VISIBLE_DEVICES=
    depends_on:
      indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── ENRICHER ───────────────────────────────────────────────────────────────
  enricher:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    command: uvicorn instagram_scraper:app --host 0.0.0.0 --port 8084
    ports:
      - "8084:8084"
    volumes:
      - data:/data
    environment:
      - ENRICHER_INPUT=/data/scraped_data.json
      - ENRICHER_OUTPUT=/data/enriched_data.json
      - REDIS_URL=redis://redis:6379
      - INSTAGRAM_MAX_POSTS=10
      - INSTAGRAM_SLEEP=4.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── DB WRITER ──────────────────────────────────────────────────────────────
  db_writer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    command: uvicorn db_writer:app --host 0.0.0.0 --port 8086
    ports:
      - "8086:8086"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-neredenevar}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf_cache:   # sentence-transformers model cache
  data:       # scraped_data.json, analyzed_data.json, chroma_db/ (shared between services)
  pg_data:    # postgres persistent storage