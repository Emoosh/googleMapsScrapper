services:

  # ─── POSTGRES + POSTGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-neredenevar}
      POSTGRES_USER:     ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-neredenevar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── LLM ────────────────────────────────────────────────────────────────────
  llm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: >
      --model ytu-ce-cosmos/Turkish-Gemma-9b-T1
      --served-model-name turkish-gemma
      --dtype bfloat16
      --quantization bitsandbytes
      --load-format bitsandbytes
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --max-num-seqs 64
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─── SCRAPER ────────────────────────────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SCRAPER_OUTPUT=/data/scraped_data.json
      - HEADLESS=true
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── ANALYZER ───────────────────────────────────────────────────────────────
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: uvicorn comment_analyzer:fa_app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    volumes:
      - data:/data
    environment:
      - LLM_BASE_URL=http://llm:8000/v1
      - LLM_MODEL=turkish-gemma
      - ANALYZER_INPUT=/data/scraped_data.json
      - ANALYZER_OUTPUT=/data/analyzed_data.json
      - REDIS_URL=redis://redis:6379
      - CUDA_VISIBLE_DEVICES=
    depends_on:
      llm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── INDEXER ────────────────────────────────────────────────────────────────
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: uvicorn indexer:fa_app --host 0.0.0.0 --port 8082
    ports:
      - "8082:8082"
    volumes:
      - data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      - INDEXER_INPUT=/data/scraped_data.json
      - CHROMA_PATH=/data/chroma_db
      - REDIS_URL=redis://redis:6379
      - CUDA_VISIBLE_DEVICES=
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Q&A ────────────────────────────────────────────────────────────────────
  qa:
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: uvicorn place_qa:app --host 0.0.0.0 --port 8083
    ports:
      - "8083:8083"
    volumes:
      - data:/data
      - hf_cache:/root/.cache/huggingface
    environment:
      - LLM_BASE_URL=http://llm:8000/v1
      - LLM_MODEL=turkish-gemma
      - CHROMA_PATH=/data/chroma_db
      - CUDA_VISIBLE_DEVICES=
    depends_on:
      indexer:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  hf_cache:   # vLLM + sentence-transformers model cache
  data:       # scraped_data.json, analyzed_data.json, chroma_db/ (shared between services)
  pg_data:    # postgres persistent storage